<!DOCTYPE html>
<html>
<head>
    <title>Movie Sentiment Analyzer</title>
</head>
<body>
    <h1>🎬 Movie Review Sentiment Analyzer</h1>
    <form method="POST">
        <textarea name="review" rows="5" cols="50"></textarea><br><br>
        <button type="submit">Analyze</button>
    </form>
    
    {% if predictions %}
        <h2>Results:</h2>
        <ul>
            {% for model, sentiment in predictions.items() %}
                <li><strong>{{ model }}:</strong> {{ sentiment }}</li>
            {% endfor %}
        </ul>
        
        <h2>Confidence Chart:</h2>
        <img src="data:image/png;base64,{{ chart }}" alt="Model Comparison Chart"/>
        <br><br>
        <a href="/download_chart">
            <button type="button">📥 Download Chart</button>
        </a>
        
        <form method="POST" action="/download_csv">
            <input type="hidden" name="review" value="{{ review }}">
            <button type="submit">📥 Download Predictions CSV</button>
        </form>
    {% endif %}
</body>
</html>
